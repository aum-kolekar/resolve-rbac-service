name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rbac
          POSTGRES_PASSWORD: rbac
          POSTGRES_DB: rbac_service
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rbac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

      - run: npx node-pg-migrate up
        env:
          DATABASE_URL: postgres://rbac:rbac@localhost:5432/rbac_service

      - run: npm test
        env:
          DATABASE_URL: postgres://rbac:rbac@localhost:5432/rbac_service
          REDIS_URL: redis://localhost:6379
